[project]
name = "telemetria-backend"
version = "0.1.0"
description = "Plataforma de telemetria de frota: API, ingestão e workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy[asyncio]==2.0.58",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "redis==8.1.0",
    "structlog==26.1.0",
    "shapely==2.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "httpx==0.28.1",
    "asyncpg-stubs==0.32.0",
    "pre-commit==4.7.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos em português usam acentos e símbolos

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]  # SQL de teste com nomes de tabela fixos
"app/db/migrations/**" = ["S608", "E501"]  # DDL estático, sem entrada externa

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["shapely", "shapely.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.domain.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: precisa de TimescaleDB e Redis reais"]
