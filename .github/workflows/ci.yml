name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      timescaledb:
        image: timescale/timescaledb:2.32.1-pg16
        env:
          POSTGRES_DB: telemetria
          POSTGRES_USER: telemetria_owner
          POSTGRES_PASSWORD: ci-only-owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U telemetria_owner -d telemetria"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.8.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Credenciais descartáveis, só do banco efêmero do CI.
      DATABASE_URL: postgresql+asyncpg://telemetria_app:ci-only-app@localhost:5432/telemetria
      MIGRATION_DATABASE_URL: postgresql+asyncpg://telemetria_owner:ci-only-owner@localhost:5432/telemetria
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Criar role da aplicação (mesmo script do docker)
        env:
          PGPASSWORD: ci-only-owner
          POSTGRES_USER: telemetria_owner
          POSTGRES_DB: telemetria
          APP_DB_PASSWORD: ci-only-app
        run: PGHOST=localhost bash ../docker/timescaledb/01-init.sh
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - name: Migrations sobem do zero
        run: alembic upgrade head
      - run: pytest -v

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
